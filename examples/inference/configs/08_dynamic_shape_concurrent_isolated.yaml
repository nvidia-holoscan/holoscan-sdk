# 08 - Full-featured: two dynamic-shape models, run concurrently, with CUDA Graphs and a
# cuda_green_context_pool for context-isolated concurrent capture.
model_path_map:
  model_a: ../models/identity_model_dynamic.onnx
  model_b: ../models/identity_model_dynamic.onnx
input_map:
  model_a: [tensor_a_in]
  model_b: [tensor_b_in]
output_map:
  model_a: [tensor_a_out]
  model_b: [tensor_b_out]
parallel_inference: true
dynamic_input_dims: true
enable_cuda_graphs: true
cuda_stream_pool:
  max_size: 4
cuda_green_context_pool:
  num_partitions: 2
  # Length must equal num_partitions. Each entry is a partition's SM count and must be a multiple
  # of the device's structured_sm_quantum (query with query_cuda_green_context_capability at
  # runtime; typical values on modern NVIDIA parts are 8 or 12). The values below are a
  # conservative-small default that fits on any device supporting green contexts.
  sms_per_partition: [8, 8]
