# 04 - Same two independent models as 02, run concurrently on dedicated per-model streams.
model_path_map:
  model_a: ../models/identity_model.onnx
  model_b: ../models/identity_model.onnx
input_map:
  model_a: [tensor_a_in]
  model_b: [tensor_b_in]
output_map:
  model_a: [tensor_a_out]
  model_b: [tensor_b_out]
parallel_inference: true
cuda_stream_pool:
  max_size: 4
