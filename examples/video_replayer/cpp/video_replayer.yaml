---
dual_window: false
data_logging: true

replayer:
  directory: "../data/racerx"
  basename: "racerx"
  frame_rate: 0   # as specified in timestamps
  repeat: true    # default: false
  realtime: true  # default: true
  count: 0        # default: 0 (no frame count restriction)

# Initial size below is set to 8 MB which is sufficient for
# a 1920 * 1080 RGBA image (uint8_t).
rmm_allocator:
  device_memory_initial_size: "8 MB"
  device_memory_max_size: "8 MB"
  host_memory_initial_size: "8 MB"
  host_memory_max_size: "8 MB"
  dev_id: 0

holoviz:
  width: 854
  height: 480
  tensors:
    - name: ""
      type: color
      opacity: 1.0
      priority: 0

event_based_scheduler:
  worker_thread_number: 3
  stop_on_deadlock: true
  stop_on_deadlock_timeout: 200

async_console_logger:
  log_inputs: true
  log_outputs: true
  log_metadata: false
  log_tensor_data_content: true
  allowlist_patterns: []
  denylist_patterns: []
  queue_type: lock_free

simple_text_serializer:
  max_elements: 10
