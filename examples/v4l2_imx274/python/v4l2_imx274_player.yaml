---
receiver:  # V4L2VideoCaptureOp
  device: "/dev/video0"
  pixel_format: "RG10"

  # If omitted, V4L2 auto-selects the device default.
  width: 3840
  height: 2160

raw_image_processor:  # RawImageProcessorOp
  bayer_grid: 1  # NppiBayerGridPosition: 0=BGGR, 1=RGGB (RG10/RG12), 2=GRBG, 3=GBRG
  raw_depth: 1   # holoscan::csi::PixelFormat: 1=RAW_10, 2=RAW_12
  optical_black: 50

holoviz:  # HolovizOp
  framebuffer_srgb: true
