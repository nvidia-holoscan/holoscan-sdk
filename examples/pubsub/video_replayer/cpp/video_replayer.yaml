# Publisher: VideoStreamReplayerOp configuration.
# Set HOLOSCAN_INPUT_PATH to override the data directory at runtime.
replayer:
  directory: "../data/racerx"
  basename: "racerx"
  frame_rate: 0   # honour timestamps embedded in the recording
  repeat: true    # loop indefinitely so late-joining subscribers see frames
  realtime: true
  count: 0        # 0 = no frame count restriction

# Publisher: RMM pool allocator for VideoStreamReplayerOp.
# Racerx frames are 854x480 RGB (uint8), ~1.2 MB each.
rmm_allocator:
  device_memory_initial_size: "16 MB"
  device_memory_max_size: "64 MB"
  host_memory_initial_size: "8 MB"
  host_memory_max_size: "8 MB"
  dev_id: 0

# Subscriber: HolovizOp display configuration.
holoviz:
  width: 854
  height: 480
  interrupt_app_on_window_close: true
  tensors:
    - name: ""      # match any tensor name emitted by VideoStreamReplayerOp
      type: color
      opacity: 1.0
      priority: 0
