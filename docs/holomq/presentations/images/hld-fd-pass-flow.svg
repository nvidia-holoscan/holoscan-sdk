<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="288" viewBox="0 0 960 288" role="img" aria-labelledby="title desc">
  <title id="title">holomq VMM FD-pass sharing</title>
  <desc id="desc">Publisher FD-pass server exports VMM handle; subscriber maps via Context import.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5a8f00"/>
    </marker>
    <marker id="fd" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d4a017"/>
    </marker>
  </defs>
  <style>
    .h { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #1a1a1a; }
    .c { font-family: Consolas, Menlo, monospace; font-size: 14px; fill: #333; }
    .d { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #666; }
  </style>

  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>

  <rect x="24" y="24" width="352" height="240" rx="8" fill="#fafbfc" stroke="#c8d1dc" stroke-width="1.5"/>
  <text x="200" y="52" text-anchor="middle" class="h">Publisher process</text>
  <text x="44" y="80" class="c">ContextBuilder::with_vmm_fd_export(true)</text>
  <text x="44" y="104" class="c">create_device_buffer_pool(...)</text>
  <text x="44" y="128" class="c">Buffer::export_handle(stream)</text>
  <text x="44" y="152" class="d">BufferHandle carries fd_pass_socket_path (opaque)</text>
  <rect x="44" y="160" width="312" height="64" rx="4" fill="#eef7e8" stroke="#76b900" stroke-width="1.5"/>
  <text x="200" y="188" text-anchor="middle" class="c">AF_UNIX FD-pass server</text>
  <text x="200" y="208" text-anchor="middle" class="d">exports CUDA VMM POSIX FD</text>

  <rect x="410" y="84" width="140" height="56" rx="6" fill="#fff" stroke="#76b900" stroke-width="1.5"/>
  <text x="480" y="110" text-anchor="middle" class="c">BufferHandle</text>
  <text x="480" y="128" text-anchor="middle" class="d">in Payload</text>

  <line x1="376" y1="112" x2="408" y2="112" stroke="#76b900" stroke-width="2" marker-end="url(#a)"/>
  <line x1="550" y1="112" x2="582" y2="112" stroke="#76b900" stroke-width="2" marker-end="url(#a)"/>

  <rect x="584" y="24" width="352" height="240" rx="8" fill="#fafbfc" stroke="#c8d1dc" stroke-width="1.5"/>
  <text x="760" y="52" text-anchor="middle" class="h">Subscriber process</text>
  <text x="604" y="80" class="c">ContextBuilder::create()</text>
  <text x="604" y="104" class="d">(no FD-pass server)</text>
  <text x="604" y="128" class="c">import_buffer(handle, stream)</text>
  <rect x="604" y="160" width="312" height="64" rx="4" fill="#eef6fc" stroke="#7eb8e0" stroke-width="1.5"/>
  <text x="760" y="188" text-anchor="middle" class="c">map VMM / attach SHM</text>
  <text x="760" y="208" text-anchor="middle" class="d">cached per pool identity</text>
  <text x="604" y="248" class="d">Host: POSIX SHM payload + optional CUDA register</text>

  <!-- FD request at 0.25 box height; response at 0.75 (boxes y=160 h=64) -->
  <line x1="604" y1="176" x2="356" y2="176" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#fd)"/>
  <text x="480" y="166" text-anchor="middle" class="d">FD request (path from handle)</text>

  <line x1="356" y1="208" x2="604" y2="208" stroke="#d4a017" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#fd)"/>
  <text x="480" y="198" text-anchor="middle" class="d">returns VMM POSIX FD</text>
</svg>
