<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="675" height="520" viewBox="0 0 675 520" role="img" aria-labelledby="title desc">
  <title id="title">holomq publisher per-frame flow</title>
  <desc id="desc">Publisher public API per-frame call sequence.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#444"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#5a8f00"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000" flood-opacity="0.1"/>
    </filter>
    <style>
      .title { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #1a1a1a; }
      .subtitle { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; fill: #666; }
      .step-num { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #fff; }
      .code { font-family: Consolas, Menlo, "DejaVu Sans Mono", monospace; font-size: 11.5px; fill: #1a1a1a; }
      .code-dim { font-family: Consolas, Menlo, "DejaVu Sans Mono", monospace; font-size: 10px; fill: #555; }
      .code-type { font-family: Consolas, Menlo, "DejaVu Sans Mono", monospace; font-size: 10px; fill: #0b5394; }
      .code-r { text-anchor: end; }
      .wire-label { font-family: Consolas, Menlo, monospace; font-size: 10px; fill: #2d5016; font-weight: 600; }
    </style>
  </defs>

  <rect x="20" y="12" width="635" height="408" rx="10" fill="#fafbfc" stroke="#c8d1dc" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="337.5" y="38" text-anchor="middle" class="title">Publisher process</text>
  <text x="337.5" y="54" text-anchor="middle" class="subtitle">expected APIs — check has_value(); unwrap with .value()</text>
  <line x1="45" y1="64" x2="630" y2="64" stroke="#e2e8ef"/>

  <g id="step-1">
    <circle cx="60" cy="88" r="11" fill="#5a8f00"/><text x="60" y="92" text-anchor="middle" class="step-num">1</text>
    <rect x="85" y="72" width="550" height="32" rx="5" fill="#fff" stroke="#c8d1dc"/>
    <text x="100" y="92" class="code">auto msg_or = publisher.loan();</text>
    <text x="622" y="92" class="code-type code-r">expected&lt;OutboundMessage, Error&gt;</text>
  </g>
  <line x1="360" y1="104" x2="360" y2="116" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <g id="step-2">
    <circle cx="60" cy="132" r="11" fill="#5a8f00"/><text x="60" y="136" text-anchor="middle" class="step-num">2</text>
    <rect x="85" y="116" width="550" height="32" rx="5" fill="#fff" stroke="#c8d1dc"/>
    <text x="100" y="136" class="code">auto buf_or = pool.acquire();</text>
    <text x="622" y="136" class="code-type code-r">expected&lt;Buffer, Error&gt;</text>
  </g>
  <line x1="360" y1="148" x2="360" y2="160" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <g id="step-3">
    <circle cx="60" cy="176" r="11" fill="#5a8f00"/><text x="60" y="180" text-anchor="middle" class="step-num">3</text>
    <rect x="85" y="160" width="550" height="32" rx="5" fill="#eef6fc" stroke="#7eb8e0"/>
    <text x="100" y="180" class="code">myKernel&lt;&lt;&lt;grid, block, 0, stream&gt;&gt;&gt;(buf_or.value().ptr(), ...);</text>
    <text x="622" y="180" class="code-dim code-r">app</text>
  </g>
  <line x1="360" y1="192" x2="360" y2="204" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <g id="step-4">
    <circle cx="60" cy="228" r="11" fill="#5a8f00"/><text x="60" y="232" text-anchor="middle" class="step-num">4</text>
    <rect x="85" y="204" width="550" height="48" rx="5" fill="#fff8e6" stroke="#d4a017"/>
    <text x="100" y="224" class="code">auto exported_or = buf_or.value().export_handle(stream);</text>
    <text x="100" y="242" class="code-dim">// WriteValue(G); defer release_ref on ~buf when stream completes</text>
  </g>
  <line x1="360" y1="252" x2="360" y2="264" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <g id="step-5">
    <circle cx="60" cy="280" r="11" fill="#5a8f00"/><text x="60" y="284" text-anchor="middle" class="step-num">5</text>
    <rect x="85" y="264" width="550" height="32" rx="5" fill="#fff" stroke="#c8d1dc"/>
    <text x="100" y="284" class="code">msg_or-&gt;payload().buffer_handle = exported_or.value();</text>
  </g>
  <line x1="360" y1="296" x2="360" y2="308" stroke="#888" stroke-width="1.2" marker-end="url(#arrow)"/>

  <g id="step-6">
    <circle cx="60" cy="352" r="11" fill="#5a8f00"/><text x="60" y="356" text-anchor="middle" class="step-num">6</text>
    <rect x="85" y="320" width="550" height="56" rx="5" fill="#eef7e8" stroke="#76b900"/>
    <text x="100" y="340" class="code">publisher.send(std::move(msg_or).value(),</text>
    <text x="100" y="356" class="code">    [buf = std::move(buf_or).value()]() { /* on_released */ });</text>
    <text x="100" y="372" class="code-dim">// owner Buffer until transport releases sample</text>
  </g>

  <rect x="85" y="388" width="550" height="28" rx="4" fill="#f0f4f8" stroke="#b8c4d0" stroke-dasharray="4 3"/>
  <text x="360" y="406" text-anchor="middle" class="code-dim">repeat each frame</text>

  <line x1="360" y1="420" x2="360" y2="438" stroke="#76b900" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="210" y="442" width="300" height="52" rx="6" fill="#fff" stroke="#76b900" stroke-width="1.2"/>
  <text x="360" y="462" text-anchor="middle" class="wire-label">OutboundMessage&lt;Payload&gt;</text>
  <text x="360" y="480" text-anchor="middle" class="code-dim">Payload.buffer_handle to Subscriber</text>

  <rect x="45" y="442" width="150" height="52" rx="6" fill="#fffdf5" stroke="#e6b84d"/>
  <text x="120" y="462" text-anchor="middle" class="code-dim">GPU-ready:</text>
  <text x="120" y="478" text-anchor="middle" class="code">WriteValue(G)</text>
  <text x="120" y="492" text-anchor="middle" class="code-dim">before send</text>
</svg>
