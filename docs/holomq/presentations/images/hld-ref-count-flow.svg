<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="290" viewBox="0 0 960 290" role="img" aria-labelledby="title desc">
  <title id="title">holomq publisher ref-count lease flow</title>
  <desc id="desc">acquire CAS 0 to 1, Buffer lease, export_handle defer, send with on_released.</desc>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .b { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #1a1a1a; }
    .s { font-family: Consolas, Menlo, monospace; font-size: 14px; fill: #0b5394; }
    .d { font-family: "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #666; }
  </style>

  <rect x="0" y="0" width="100%" height="100%" fill="#ffffff"/>

  <rect x="24" y="24" width="202.5" height="80" rx="6" fill="#eef7e8" stroke="#76b900" stroke-width="1.5"/>
  <text x="125.25" y="52" text-anchor="middle" class="b">Publisher</text>
  <text x="125.25" y="74" text-anchor="middle" class="s">acquire()</text>
  <text x="125.25" y="92" text-anchor="middle" class="d">CAS ref 0 to 1</text>

  <line x1="226.5" y1="64" x2="260.5" y2="64" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="260.5" y="24" width="202.5" height="80" rx="6" fill="#fff" stroke="#c8d1dc" stroke-width="1.5"/>
  <text x="361.75" y="70" text-anchor="middle" class="s">Buffer lease</text>

  <line x1="463" y1="64" x2="497" y2="64" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="497" y="24" width="202.5" height="80" rx="6" fill="#fff8e6" stroke="#d4a017" stroke-width="1.5"/>
  <text x="598.25" y="52" text-anchor="middle" class="b">export_handle</text>
  <text x="598.25" y="74" text-anchor="middle" class="d">defer release on stream</text>

  <line x1="699.5" y1="64" x2="733.5" y2="64" stroke="#444" stroke-width="1.2" marker-end="url(#arr)"/>
  <rect x="733.5" y="24" width="202.5" height="80" rx="6" fill="#eef6fc" stroke="#7eb8e0" stroke-width="1.5"/>
  <text x="834.75" y="50" text-anchor="middle" class="b">send + on_released</text>
  <text x="834.75" y="72" text-anchor="middle" class="d">hold Buffer until</text>
  <text x="834.75" y="90" text-anchor="middle" class="d">transport releases</text>

  <rect x="24" y="132" width="912" height="138" rx="8" fill="#fafbfc" stroke="#c8d1dc" stroke-width="1.5"/>
  <text x="480" y="162" text-anchor="middle" class="b">Cross-process SHM ref-count segment</text>
  <text x="44" y="200" class="d">Slot unavailable for acquire() while ref_count &gt; 0</text>
  <text x="44" y="228" class="d">ref_count 0: no leases remain; deferred release has completed on bound streams</text>
</svg>
