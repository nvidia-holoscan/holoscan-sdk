# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

# Paired begin/end comments delimit configuration owned by documentation tooling.
# Keep each pair unique and intact; see ../README.md for the ownership convention.

# Library API docs (Beta): `fern docs md generate`, then
# `python3 docs/scripts/fix_generated_library_mdx.py`
# (fixes ParamField type ampersands, default=""..."" string literals, description angle brackets).
# See https://buildwithfern.com/learn/docs/api-references/library-reference
# holoscan-tokenless-library:begin
libraries:
  holoscan-cpp:
    # Generate from the selected checkout so release and archive API pages match
    # the same source revision as the user guide.
    input:
      path: ../../include/holoscan
    output:
      path: ./generated/api-reference/cpp
    lang: cpp
  holoscan-python:
    # build_holoscan_docs.py projects the selected checkout's public facade
    # stubs into this transient source tree. The private extension is excluded.
    input:
      path: ../.python-api-reference
    output:
      path: ./generated/api-reference/python
    lang: python
# holoscan-tokenless-library:end

instances:
  - url: nvidia-holoscan.docs.buildwithfern.com/holoscan/sdk-user-guide
    custom-domain: docs.nvidia.com/holoscan/sdk-user-guide
    multi-source: true

global-theme: nvidia

ai-search:
  location:
    - docs

title: Holoscan SDK Documentation

versions:
  # holoscan-version-sync:begin
  - display-name: 5.0 (Latest)
  # holoscan-version-sync:end
    path: ./index.yml
    availability: beta
  # Active LTSB line: lightweight version entry that redirects to the hosted
  # ltsb-2.0 user guide (still maintained separately from the latest release).
  - display-name: ltsb-2.0
    path: ./versions/ltsb-2.0.yml
  # Archived Fern versions are inserted during documentation assembly.
  # holoscan-archive-versions:begin
  # holoscan-archive-versions:end
  # "Archives" is a lightweight version entry (top version bar) whose only page
  # lists previous Holoscan SDK documentation releases (through v4.2.0).
  - display-name: Archives
    path: ./versions/archives.yml
  # To add an older version later:
  #   1. Create ./v3.5/ with the snapshot content for that release.
  #   2. Add a nav file at ./versions/v3.5.yml pointing at those pages.
  #   3. Append an entry below (older versions get versioned URL paths like /v3.5/...):
  # - display-name: '3.5'
  #   path: ./versions/v3.5.yml
  #   availability: stable

layout:
  searchbar-placement: header
  page-width: 1376px
  sidebar-width: 248px
  content-width: 812px
  tabs-placement: header
  hide-feedback: true

colors:
  accentPrimary:
    dark: '#76B900'
    light: '#76B900'
  background:
    light: '#FFFFFF'
    dark: '#000000'
typography:
  bodyFont:
    name: NVIDIA
    paths:
      - path: assets/fonts/NVIDIASans.woff2
        style: normal
      - path: assets/fonts/NVIDIASans_Italic.woff2
        style: italic
  codeFont:
    name: RobotoMono
    paths:
      - path: assets/fonts/RobotoMono.woff2
theme:
  page-actions: toolbar
  footer-nav: minimal

logo:
  dark: assets/NVIDIA_dark.svg
  light: assets/NVIDIA_light.svg
  height: 20
  href: /holoscan/sdk-user-guide
  right-text: Holoscan SDK Documentation

favicon: assets/NVIDIA_symbol.svg

# Send unmatched paths to the docs homepage instead of Fern's 404 page.
# Prefer explicit `redirects` below for known Sphinx → Fern page moves.
settings:
  hide-404-page: true
  substitute-env-vars: false

# holoscan-publishing-config:begin
# Same GA4 property as HoloHub (nvidia-holoscan.github.io/holohub) and
# nvidia-holoscan.github.io.
analytics:
  ga4:
    measurement-id: G-S5CCWVS2B6
# holoscan-publishing-config:end

js:
  - url: https://assets.adobedtm.com/5d4962a43b79/c1061d2c5e7b/launch-191c2462b890.min.js
    strategy: beforeInteractive
  - path: dist/output.js
    strategy: afterInteractive
css:
  - assets/main.css
  - dist/output.css

