# markdownlint configuration for public/ (examples, READMEs, docs)
# https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
MD013:
  line_length: 1600
  code_block_line_length: 1600
  heading_line_length: 1600
# Allow duplicate "Build instructions" / "Run instructions" across C++/Python sections
MD024:
  allow_different_nesting: true
  siblings_only: true
# Fenced code without language (e.g. ASCII diagrams, Sphinx directives)
MD040: false
# First line not h1 (metadata, Sphinx (label)=)
MD041: false
# Heading increment (e.g. #### Note sections)
MD001: false
# Emphasis as heading (e.g. **Pattern name**)
MD036: false
# Alt text (some images have captions below / figure directives)
MD045: false
# Link fragments (third-party READMEs, Sphinx refs)
MD051: false
# Descriptive link text
MD059: false
# Table column style
MD060: false
# Code block style (mixed in Sphinx output)
MD046: false
# Inline HTML (e.g. <br> in tables)
MD033: false
