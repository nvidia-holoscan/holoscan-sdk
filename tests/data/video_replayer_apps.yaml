replayer:
  directory: "../data/racerx"
  basename: "racerx"
  frame_rate: 0   # as specified in timestamps
  repeat: false   # default: false
  realtime: true  # default: true
  count: 10       # default: 0 (no frame count restriction)

holoviz:
  width: 960
  height: 540
  headless: true
  tensors:
    - name: ""
      type: color
      opacity: 1.0
      priority: 0
