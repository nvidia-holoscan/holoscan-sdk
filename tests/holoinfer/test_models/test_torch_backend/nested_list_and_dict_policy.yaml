inference:
  input_format:
  - - input1: 0_0_input1
    - input1: 0_1_input1
      input2: 0_1_input2
  input_nodes:
    0_0_input1:
      dim: '3'
      dtype: kFloat32
    0_1_input1:
      dim: '3'
      dtype: kFloat32
    0_1_input2:
      dim: '3'
      dtype: kFloat32
  output_format: tensor_0
  output_nodes:
    tensor_0:
      dim: '3'
      dtype: kFloat32
