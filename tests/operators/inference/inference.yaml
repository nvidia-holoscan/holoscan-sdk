---
inference:
  in_tensor_names: ["tensor"]
  out_tensor_names: ["tensor"]
  parallel_inference: true
  infer_on_cpu: false
  enable_fp16: false
  enable_cuda_graphs: true
  input_on_cuda: true
  output_on_cuda: true
  transmit_on_cuda: true
  pre_processor_map:
    "first": "tensor"
  inference_map:
    "first": "tensor"
