# 02 - Two independent models, no data flow between them (disjoint tensor names).
model_path_map:
  model_a: ../models/identity_model.onnx
  model_b: ../models/identity_model.onnx
input_map:
  model_a: [tensor_a_in]
  model_b: [tensor_b_in]
output_map:
  model_a: [tensor_a_out]
  model_b: [tensor_b_out]
parallel_inference: false
