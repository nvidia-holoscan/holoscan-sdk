# 06 - Same as 05, plus a cuda_green_context_pool: each model gets its own SM partition, so
# concurrent CUDA-Graph capture is protected by context isolation instead of a runtime mutex --
# the best-throughput concurrent configuration (see ../README.md).
model_path_map:
  model_a: ../models/identity_model.onnx
  model_b: ../models/identity_model.onnx
input_map:
  model_a: [tensor_a_in]
  model_b: [tensor_b_in]
output_map:
  model_a: [tensor_a_out]
  model_b: [tensor_b_out]
parallel_inference: true
enable_cuda_graphs: true
cuda_stream_pool:
  max_size: 4
cuda_green_context_pool:
  num_partitions: 2
