syntax = "proto3";

package holoscan.distributed;

message AvailableSystemResource
{
    optional string cpu = 1;
    optional string gpu = 2;
    optional string memory = 3;
    optional string gpu_memory = 4;
    optional string shared_memory = 5;
}
