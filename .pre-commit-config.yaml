# Pre-commit hooks for Holoscan SDK
# See https://pre-commit.com for more information
# Install: pip install pre-commit && pre-commit install  (or: uvx pre-commit install)
# Run manually: pre-commit run --all-files
default_language_version:
  python: python3

# Published skill packages must remain byte-identical to their signed source.
# Formatting, whitespace, spelling, or copyright fixes invalidate skill.oms.sig.
# Exclude skill package subdirectories while linting top-level documentation.
exclude: ^skills/[^/]+/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: ^.*\.patch$
      - id: end-of-file-fixer
        exclude: ^.*\.patch$
      - id: check-yaml
        # Exclude .clang-format file because check-yaml do not support multi-document file
        exclude: ^.*\.patch|\.clang-format$
      - id: check-json
        exclude: ^.*\.patch$
      - id: check-added-large-files
        exclude: ^.*\.patch$|^ci/abi/holomq\.exports\.baseline\.txt$

  # Repository-local validation and regression hooks
  - repo: local
    hooks:
      - id: check-copyright
        name: Check copyright headers
        # Commits check staged paths. Wide lists from ``--all-files`` are narrowed to the
        # main/release diff unless an explicit base is supplied. Use the script's ``--full-scan``
        # option for a deliberate full-tree audit.
        entry: python3 scripts/check_copyright.py
        args:
          - --reject-nvidia-proprietary-path
          - ^.*
          - --exclude
          - CodeCoverage.cmake
          - --exclude
          - common-debian.sh
          # Paths are rooted at the repository layout represented by this config.
          - --exclude
          - ^\.cache
          - --exclude
          - ^build
          - --exclude
          - ^install
          - --exclude
          - ^build-*
          - --exclude
          - ^install-*
          - --exclude
          - ^modules/holoviz/thirdparty/
          - --exclude
          - .*\.patch$
          - --exclude
          - docs/fern/dist/
          - --exclude
          - ^ci/abi/holomq\.exports\.baseline\.txt$
          - --update-current-year
        language: system
        pass_filenames: true

      - id: test-check-copyright
        name: Test copyright header checker
        entry: pytest scripts/test_check_copyright.py
        language: python
        additional_dependencies:
          - pytest
        pass_filenames: false
        files: ^scripts/(check_copyright|test_check_copyright)\.py$

      # run is a bootstrap entry point used before CMake/CTest exists.
      # Use the host Python, Bash, and Git; the test has no third-party Python dependencies.
      - id: test-run-script
        name: Test run script git integration
        entry: python3 scripts/test_run_script.py
        language: system
        pass_filenames: false
        files: ^(run|scripts/test_run_script\.py)$

      - id: check-doc-source-links
        name: Check documentation source links
        entry: python3 docs/scripts/render_source_links.py --docs-root docs --write
        language: system
        pass_filenames: true
        files: ^docs/.*\.mdx?$

      - id: check-doc-links
        name: Check documentation links
        entry: python3 docs/scripts/check_doc_links.py
        language: system
        pass_filenames: false
        files: ^docs/

      - id: check-local-markdown-links
        name: Check local Markdown file links
        entry: python3 docs/scripts/check_doc_links.py --local-files-only
        language: system
        pass_filenames: false
        files: ^

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.6
    hooks:
      - id: remove-tabs  # Replace tabs by whitespaces before committing
        args: [--whitespaces-count, '4']  # defaults to: 4
        exclude: |
          (?x)^(
            modules/holoviz/thirdparty/
          )
        types_or: [c++, cmake, dockerfile, markdown, python, shell]

  # Lint: Ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^
        exclude: ^scripts/register_devzone_release\.py$
      - id: ruff-format
        files: ^
        exclude: ^scripts/register_devzone_release\.py$

  # Codespell
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli>=2.0.1,<3.0; python_version<'3.11'
        files: ^
        exclude: ^docs/fern/dist/
        args:
          - --skip=*.onnx,*NOTICE.txt,*.toml,*vale*,*.patch,*ci/abi/holomq.exports.baseline.txt
          - --ignore-regex=.*codespell-ignore$
          - --toml=.codespell.toml
          - --write-changes

  # Cpplint
  - repo: https://github.com/cpplint/cpplint
    rev: 2.0.2
    hooks:
      - id: cpplint
        args:
          - --quiet
          - --exclude=.cache
          - --exclude=.local
          - --exclude=tmp
          - --exclude=build
          - --exclude=install
          - --exclude=build-\*
          - --exclude=install-\*
          - --exclude=gxf-build-\*
          - --exclude=src/core/distributed/generated
          - --exclude=src/core/services/generated
          - --exclude=modules/holoviz/thirdparty/nvpro_core
          - --exclude=examples/custom_cuda_kernel_multi_sample/cpp/edge_detection.cu
          - --filter=-whitespace/indent_namespace,-build/c++17,-build/include_order
        files: ^.*\.(cpp|cu|cuh|h|hpp|cc|cxx)$
        # Paths are rooted at the internal source tree's export directory
        exclude: |
          (?x)^(
            \.cache|
            \.local|
            tmp|
            build|
            install|
            build-|
            install-|
            gxf-build-|
            src/core/distributed/generated/|
            src/core/services/generated/|
            modules/holoviz/thirdparty/nvpro_core/|
            examples/custom_cuda_kernel_multi_sample/cpp/edge_detection\.cu$
          )

  # cmakelint
  - repo: local
    hooks:
      - id: cmakelint
        name: cmakelint
        entry: cmakelint
        language: python
        additional_dependencies: ["cmakelint>=1.4.2,<2.0"]
        args:
          - "--filter=-whitespace/indent,-linelength,-readability/wonkycase,-convention/filename,-package/stdargs"
        files: ^.*(CMakeLists\.txt|\.cmake)$
        exclude: ^(build|install|build-|install-|\.cache)/

  # Header guards and ABI/export policy
  - repo: local
    hooks:
      - id: check-header-guards
        name: Check header guards
        entry: python3 scripts/check_header_guards.py
        language: system
        pass_filenames: true
        files: ^.*\.(h|hh|hpp|hxx|cuh)$

      - id: check-export-macros
        name: Check export macro policy
        entry: python3 scripts/check_export_macros.py
        language: system
        pass_filenames: true
        files: ^.*(\.(h|hh|hpp|hxx|cuh|c|cc|cpp|cxx|cu|cmake|txt)|CMakeLists\.txt|Dockerfile)$

      - id: check-export-macro-semantics
        name: Check export macro semantics
        entry: python3 scripts/check_export_macro_semantics.py --root .
        language: system
        pass_filenames: false
        always_run: true

      - id: test-header-export-checkers
        name: Test header and export checkers
        entry: python3 scripts/test_header_export_checks.py
        language: system
        pass_filenames: false
        always_run: true

      # Behavioral tests cannot prove this repository-wide negative source invariant. Keep the
      # structural guard in lint, but run it only when its checked boundary or checker changes.
      - id: check-subscriber-close-boundaries
        name: Check external subscriber close boundaries
        entry: python3 scripts/check_subscriber_close_boundaries.py --root .
        language: system
        pass_filenames: false
        files: |
          (?x)^(
            src/runtime/.*\.(cpp|cu|cuh|hpp)|
            include/holoscan/channel/(endpoint_interfaces|inline_endpoints|tensor_schema_endpoints)\.hpp|
            src/channel/channel_tensor\.cpp|
            scripts/check_subscriber_close_boundaries\.py
          )$

      - id: test-subscriber-close-boundaries
        name: Test external subscriber close checker
        entry: pytest scripts/test_subscriber_close_boundaries.py
        language: python
        additional_dependencies:
          - pytest
        pass_filenames: false
        files: ^scripts/(check|test)_subscriber_close_boundaries\.py$

  # markdownlint
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
        args: [--fix, --config, .markdownlint.yaml]
        files: ^.*\.mdx?$
        types_or: [markdown, mdx]
        exclude: |
          (?x)^(
            design_requirements/.*\.mdx?|
            swipat/summary\.md
          )$

  # clang-format
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v21.1.8
    hooks:
      - id: clang-format
        exclude: ^docs/fern/dist/
